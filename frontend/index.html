<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ludora-ui</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Borel&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,400,300&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <div id="error-log" style="color: red; white-space: pre-wrap; padding: 20px; font-family: monospace; z-index: 9999; position: relative;"></div>
    <script>
      window.addEventListener('error', (event) => {
        document.getElementById('error-log').innerText += 'Error: ' + event.message + '\n' + event.error?.stack + '\n\n';
      });
      window.addEventListener('unhandledrejection', (event) => {
        document.getElementById('error-log').innerText += 'Unhandled Promise Rejection: ' + event.reason + '\n\n';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
