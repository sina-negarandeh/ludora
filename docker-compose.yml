version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: ludora_db
    environment:
      POSTGRES_USER: ludora
      POSTGRES_PASSWORD: ludorapassword
      POSTGRES_DB: ludoradb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ludora -d ludoradb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: ludora_backend
    environment:
      - DATABASE_URL=postgresql+psycopg://ludora:ludorapassword@db:5432/ludoradb
      - OPENAI_BASE_URL=http://host.docker.internal:8080/v1
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
      - ./scripts:/scripts
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
    container_name: ludora_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
