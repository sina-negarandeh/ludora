global:
  scrape_interval: 15s

scrape_configs:
  # The OTel Collector's own metrics exporter, not Prometheus scraping the
  # app directly -- app metrics arrive at the collector via OTLP and get
  # re-exposed here for scraping, same pipeline as traces/logs.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
