[project]
name = "ludora-backend"
version = "0.1.0"
description = "Ludora API Backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "psycopg[binary]>=3.1.19",
    "pandas>=2.2.2",
    "pgvector>=0.2.1",
    "sentence-transformers>=3.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
