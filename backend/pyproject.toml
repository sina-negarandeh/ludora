[project]
name = "ludora-backend"
version = "0.1.0"
description = "Ludora API Backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "psycopg[binary]>=3.1.19",
    "pandas>=2.2.2",
    "pgvector>=0.2.1",
    "sentence-transformers>=3.0.1",
    "scikit-learn>=1.5.0",
    "networkx>=3.0",
    "implicit>=0.7.3",
    "fasttext-wheel>=0.9.2",
    "requests>=2.34.2",
    "openai>=3.1.0",
    "mlflow>=2.14.1",
    "torch>=2.13.0",
    "transformers>=5.15.0",
    "gensim>=4.4.0",
    "mlx-embeddings>=0.0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
